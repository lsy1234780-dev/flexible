<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flexible — Modular Workspace</title>
<style>
  :root{
    --brand:#345dff; --brand-d:#1f3df5; --brand-50:#eef4ff; --brand-100:#dae6ff; --brand-700:#1a2fe1;
    --ink:#1e293b; --mut:#64748b; --mut2:#94a3b8; --line:#e2e8f0; --bg:#f6f7fb;
    --green:#059669; --green-bg:#d1fae5; --amber:#d97706; --amber-bg:#fef3c7;
    --red:#e11d48; --red-bg:#ffe4e6; --violet:#7c3aed; --violet-bg:#ede9fe;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{font-family:'Segoe UI',Inter,system-ui,sans-serif;background:#0f172a;color:var(--ink);height:100vh;overflow:hidden}
  button{font-family:inherit;cursor:pointer} input,select{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  a{color:inherit;text-decoration:none}

  .browser{height:100vh;display:flex;flex-direction:column;background:#0f172a}
  .chrome{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#1e293b;flex-shrink:0}
  .dots{display:flex;gap:7px} .dots i{width:12px;height:12px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .navbtns{display:flex;gap:4px} .navbtns button{background:none;border:none;color:#94a3b8;font-size:16px;padding:2px 6px;border-radius:6px} .navbtns button:hover{background:#334155}
  .addr{flex:1;display:flex;align-items:center;gap:8px;background:#0f172a;border-radius:999px;padding:7px 16px;color:#cbd5e1;font-size:13px}
  .addr .lock{color:#22c55e;font-size:12px} .addr .path{color:#64748b}
  .viewport{flex:1;overflow:hidden;background:var(--bg);position:relative}

  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500}
  .b-gray{background:#f1f5f9;color:var(--mut)} .b-green{background:var(--green-bg);color:var(--green)}
  .b-blue{background:var(--brand-100);color:var(--brand-700)} .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-red{background:var(--red-bg);color:var(--red)} .b-violet{background:var(--violet-bg);color:var(--violet)}
  .btn{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;border:none;transition:.15s}
  .btn-pri{background:var(--brand);color:#fff} .btn-pri:hover{background:var(--brand-d)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn-ghost:hover{background:#f8fafc}
  .btn-lg{padding:13px 26px;font-size:15px} .btn:disabled{opacity:.45;cursor:not-allowed}
  .fade{animation:fade .25s ease} @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .scroll{height:100%;overflow-y:auto}
  .row-between{display:flex;align-items:center;justify-content:space-between}

  /* landing */
  .lp-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 8vw;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center}
  .lp-nav .links{display:flex;gap:28px;align-items:center;color:var(--mut);font-size:14px;font-weight:500}
  .hero{text-align:center;padding:84px 8vw 64px;background:radial-gradient(120% 120% at 50% 0%,#eef4ff 0%,#fff 55%)}
  .hero .pill{display:inline-block;background:var(--brand-50);color:var(--brand-700);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:22px}
  .hero h1{font-size:50px;line-height:1.08;letter-spacing:-.02em;max-width:820px;margin:0 auto}
  .hero h1 span{background:linear-gradient(90deg,#345dff,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:19px;color:var(--mut);max-width:600px;margin:22px auto 32px;line-height:1.6}
  .hero .cta{display:flex;gap:12px;justify-content:center} .hero .note{margin-top:16px;font-size:13px;color:var(--mut2)}
  .logos{display:flex;gap:42px;justify-content:center;align-items:center;flex-wrap:wrap;padding:30px 8vw;color:#cbd5e1;font-weight:700;font-size:17px}
  .sec{padding:64px 8vw;max-width:1200px;margin:0 auto}
  .sec h2{font-size:34px;text-align:center;letter-spacing:-.02em} .sec .lead{text-align:center;color:var(--mut);font-size:17px;margin:14px auto 44px;max-width:560px}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .feat .c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
  .feat .ic{width:46px;height:46px;border-radius:12px;background:var(--brand-50);display:grid;place-items:center;font-size:22px;margin-bottom:16px}
  .feat h3{font-size:17px;margin-bottom:8px} .feat p{color:var(--mut);font-size:14px;line-height:1.6}
  .price{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
  .price .c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;display:flex;flex-direction:column}
  .price .c.pop{border:2px solid var(--brand);box-shadow:0 16px 40px rgba(52,93,255,.15);position:relative}
  .price .c.pop .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:12px;font-weight:600;padding:4px 14px;border-radius:999px}
  .price h3{font-size:16px;text-transform:capitalize;color:var(--mut)}
  .price .amt{font-size:40px;font-weight:700;margin:10px 0 2px} .price .amt small{font-size:15px;color:var(--mut2);font-weight:500}
  .price ul{list-style:none;margin:22px 0;flex:1} .price li{padding:8px 0;font-size:14px;display:flex;gap:9px} .price li::before{content:'✓';color:var(--green);font-weight:700}
  .ctaband{text-align:center;background:linear-gradient(120deg,#1f3df5,#7c3aed);color:#fff;padding:64px 8vw;border-radius:24px;margin:0 8vw 60px}
  .ctaband h2{font-size:34px} .ctaband p{opacity:.85;margin:14px 0 28px;font-size:17px}
  .ftr{padding:40px 8vw;color:var(--mut2);font-size:13px;text-align:center;border-top:1px solid var(--line);background:#fff}

  /* auth */
  .auth-wrap{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 0%,#eef4ff,#f6f7fb);padding:24px}
  .auth{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(15,23,42,.1);width:100%;max-width:420px;padding:36px}
  .auth .brand{justify-content:center;margin-bottom:8px}
  .auth h2{text-align:center;font-size:22px;margin-bottom:6px} .auth .sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:26px}
  .lbl{display:block;margin-bottom:14px} .lbl span{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-bottom:6px}
  .fld{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);font-size:14px;outline:none}
  .fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
  .sub-input{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .sub-input input{border:none;flex:1;padding:11px 13px;outline:none;font-size:14px;text-align:right}
  .sub-input .suffix{background:#f8fafc;padding:11px 13px;color:var(--mut2);font-size:14px;border-left:1px solid var(--line)}
  .auth .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--mut)} .auth .switch b{color:var(--brand);cursor:pointer}

  /* onboarding */
  .ob{height:100%;display:flex;flex-direction:column;background:var(--bg)}
  .ob-top{background:#fff;border-bottom:1px solid var(--line);padding:16px 6vw;display:flex;align-items:center;justify-content:space-between}
  .steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut2)}
  .steps .st{display:flex;align-items:center;gap:8px}
  .steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--mut2)}
  .steps .st.active .n{background:var(--brand);color:#fff} .steps .st.active{color:var(--ink);font-weight:600}
  .steps .st.done .n{background:var(--green);color:#fff}
  .steps .sep{width:30px;height:2px;background:var(--line)}
  .ob-body{flex:1;overflow-y:auto;padding:42px 6vw}
  .ob-h{text-align:center;margin-bottom:34px} .ob-h h2{font-size:30px;letter-spacing:-.02em} .ob-h p{color:var(--mut);font-size:16px;margin-top:10px}
  .ob-foot{background:#fff;border-top:1px solid var(--line);padding:16px 6vw;display:flex;justify-content:space-between;align-items:center}
  .ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:980px;margin:0 auto}
  .ind{text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:24px;transition:.15s}
  .ind:hover{border-color:#cbd5e1;transform:translateY(-2px)} .ind.sel{border-color:var(--brand);background:var(--brand-50)}
  .ind .ic{font-size:32px;margin-bottom:14px} .ind h3{font-size:17px;margin-bottom:6px} .ind p{font-size:13px;color:var(--mut);line-height:1.5}
  .ind .mods{margin-top:14px;font-size:12px;color:var(--mut2)}
  .mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1000px;margin:0 auto}
  .mod{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:20px;position:relative;transition:.15s}
  .mod:hover{border-color:#cbd5e1} .mod.on{border-color:var(--brand);background:var(--brand-50)}
  .mod .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .mod .ic{width:42px;height:42px;border-radius:11px;background:#f1f5f9;display:grid;place-items:center;font-size:20px}
  .mod.on .ic{background:#fff}
  .mod h3{font-size:15px;margin-bottom:5px} .mod p{font-size:12.5px;color:var(--mut);line-height:1.5}
  .mod .rec{position:absolute;top:14px;right:14px}
  .check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px;background:#fff}
  .mod.on .check{background:var(--brand);border-color:var(--brand)}
  .mod.core{opacity:.95} .mod.core .check{background:var(--mut2);border-color:var(--mut2)}

  /* preview screen (mini ERP) */
  .pv-wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
  .pv-screen{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(15,23,42,.12);background:#fff}
  .pv-bar{background:#1e293b;padding:8px 12px;display:flex;align-items:center;gap:8px}
  .pv-bar .d{width:9px;height:9px;border-radius:50%;background:#475569} .pv-url{margin-left:8px;font-size:11px;color:#94a3b8}
  .pv-app{display:flex;height:340px}
  .pv-side{width:150px;background:#fff;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:3px}
  .pv-logo{font-size:12px;font-weight:700;padding:6px 8px;margin-bottom:6px}
  .pv-nav{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:12px;color:var(--mut);font-weight:500}
  .pv-nav.active{background:var(--brand-50);color:var(--brand-700)}
  .pv-main{flex:1;background:var(--bg);padding:14px;overflow:hidden}
  .pv-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .pv-kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px} .pv-kpi .l{font-size:9px;color:var(--mut2)} .pv-kpi .v{font-size:15px;font-weight:700;margin-top:2px}
  .pv-block{background:#fff;border:1px solid var(--line);border-radius:9px;height:120px;padding:12px}
  .pv-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
  .pv-bars i{flex:1;background:var(--brand-100);border-radius:3px 3px 0 0;display:block}
  .summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  .summary h3{font-size:16px;margin-bottom:4px} .summary .s{font-size:13px;color:var(--mut);margin-bottom:18px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-50);color:var(--brand-700);padding:6px 11px;border-radius:8px;font-size:13px;font-weight:500;margin:0 6px 6px 0}
  .summary .meta{margin-top:18px;border-top:1px solid #f1f5f9;padding-top:16px;font-size:13px;color:var(--mut)}
  .summary .meta b{color:var(--ink)}
  /* assemble + live preview (2-col) */
  .assemble{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;max-width:1100px;margin:0 auto;align-items:start}
  .mod-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .assemble .mod{padding:16px}
  .pv-col{position:sticky;top:0}
  .pv-meta{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
  .pv-meta .row-between{font-size:13px;color:var(--mut);margin-bottom:8px} .pv-meta .row-between:last-child{margin-bottom:0}
  .pv-meta b{color:var(--ink)}
  .pv-flash{animation:flash .5s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(52,93,255,.5)}100%{box-shadow:0 18px 50px rgba(15,23,42,.12)}}
  .pv-nav{cursor:pointer} .pv-nav:hover{background:#f1f5f9}
  .pv-ttl{font-size:11px;font-weight:700;margin-bottom:8px}
  .pv-list{display:flex;flex-direction:column;gap:6px}
  .pv-row{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
  .pv-row .nm{font-weight:500;color:var(--ink)} .pv-row .rt{color:var(--mut)}
  .pv-main .badge{font-size:9px;padding:1px 6px}
  .pv-prog{height:5px;background:#f1f5f9;border-radius:999px;overflow:hidden;width:46px} .pv-prog i{display:block;height:100%;background:var(--brand)}
  .pv-main{overflow:hidden}

  /* ERP app */
  .app{display:flex;height:100%}
  .side{width:230px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #f1f5f9}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
  .logo b{font-size:15px} .logo .s{font-size:11px;color:var(--mut2)}
  nav.erp{padding:12px;flex:1;overflow-y:auto}
  .nav-item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;border:none;background:none;border-radius:9px;font-size:14px;font-weight:500;color:var(--mut);text-align:left;transition:.15s}
  .nav-item:hover{background:#f8fafc;color:var(--ink)} .nav-item.active{background:var(--brand-50);color:var(--brand-700)}
  .user{padding:12px;border-top:1px solid #f1f5f9}
  .urow{display:flex;align-items:center;gap:8px;padding:6px}
  .ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5a87ff,#1f3df5);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
  .logout{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--mut)} .logout:hover{background:#f8fafc}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  header.erp{background:#fff;border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;justify-content:space-between}
  header.erp h1{font-size:18px} header.erp .date{font-size:12px;color:var(--mut2)}
  .content{flex:1;overflow-y:auto;padding:26px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .grid{display:grid;gap:16px}
  table.erp{width:100%;border-collapse:collapse;font-size:14px}
  table.erp thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut2);padding:12px 8px;border-bottom:1px solid #f1f5f9}
  table.erp tbody td{padding:12px 8px;border-bottom:1px solid #f8fafc} table.erp tbody tr:hover{background:#fafbfc}
  td.r,th.r{text-align:right} td.c,th.c{text-align:center} .px{padding-left:20px;padding-right:20px}
  .s2{font-size:12px;color:var(--mut2);font-weight:400}
  .kpi-label{font-size:12px;color:var(--mut);font-weight:500}.kpi-val{font-size:26px;font-weight:600;margin-top:4px}.kpi-sub{font-size:12px;margin-top:4px}
  .erp-fld{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:14px;outline:none} .erp-fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
  .link{border:none;background:none;font-size:12px;font-weight:600;color:var(--brand)} .link.green{color:var(--green)}
  .step{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--mut);font-size:15px} .step:hover{background:#f8fafc}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px}
  .seg button{padding:6px 14px;border:none;background:none;border-radius:7px;font-size:14px;font-weight:500;color:var(--mut);text-transform:capitalize} .seg button.on{background:var(--brand);color:#fff}
  .chart{display:flex;align-items:flex-end;gap:12px;height:170px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px} .bar{width:100%;background:var(--brand);border-radius:6px 6px 0 0;transition:.3s} .bar-lbl{font-size:12px;color:var(--mut2)}
  .tg{width:44px;height:24px;border-radius:999px;border:none;position:relative;transition:.2s} .tg .knob{position:absolute;top:2px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
  .tg.on{background:var(--brand)} .tg.on .knob{left:22px} .tg.off{background:#cbd5e1} .tg.off .knob{left:2px} .tg:disabled{opacity:.4;cursor:not-allowed}
  .plan-card{text-align:left;padding:16px;border-radius:12px;border:2px solid var(--line);background:#fff;transition:.15s} .plan-card:hover{border-color:#cbd5e1} .plan-card.sel{border-color:var(--brand);background:var(--brand-50)}
  .prog{height:7px;background:#f1f5f9;border-radius:999px;overflow:hidden} .prog i{display:block;height:100%;background:var(--brand);border-radius:999px}
  .stub{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;color:var(--mut);font-size:13px}
  .overlay{position:absolute;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #f1f5f9;font-weight:600}
  .modal-b{padding:20px 24px;display:flex;flex-direction:column;gap:14px;max-height:55vh;overflow-y:auto}
  .modal-f{padding:16px 24px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px}
  .x{border:none;background:none;font-size:22px;color:var(--mut2);line-height:1}
  .erp-lbl{display:block} .erp-lbl span{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:5px}
  /* entity mention + cross-module link */
  .ent{display:inline-flex;align-items:center;gap:3px;background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-100);padding:0 7px;border-radius:6px;font-size:.92em;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
  .ent:hover{background:var(--brand-100)}
  .flash-row{animation:rowflash 1.6s ease}
  @keyframes rowflash{0%,28%{background:var(--amber-bg)!important}100%{background:transparent}}
  /* chat */
  .chat{display:flex;flex-direction:column;height:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .chat-h{padding:14px 18px;border-bottom:1px solid #f1f5f9;font-weight:600;display:flex;align-items:center;gap:8px}
  .chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:#fafbfc}
  .msg{display:flex;gap:10px} .msg .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}

  const col=st=>{const cards=S.leads.filter(l=>l.stage===st);return `<div class="kcol"><h4>${st}<span>${cards.length}</span></h4>${cards.map(l=>`<div class="lead-card" data-flash="${esc(l.title)}"><div class="t">${esc(l.title)}</div><div class="p">${esc(l.partner)} · ${esc(l.owner)}</div><div class="row-between"><span class="v">${fmt(l.value)}</span>${st!=='계약'?`<button class="link" data-act="lead-adv" data-id="${l.id}">다음 →</button>`:badge('green','수주')}</div></div>`).join('')||'<div class="s2" style="padding:8px;text-align:center">—</div>'}</div>`;};
  const total=S.leads.reduce((s,l)=>s+l.value,0);
  return `<div class="fade" style="display:flex;flex-direction:column;gap:16px"><div class="row-between"><div><b style="font-size:16px">영업 파이프라인</b><div class="s2">예상 매출 ${fmt(total)} · ${S.leads.length}건</div></div><button class="btn btn-pri">+ 새 딜</button></div><div class="kanban">${stages.map(col).join('')}</div></div>`;
}
const PAGES={dashboard:pageDashboard,partners:pagePartners,leads:pageLeads,products:pageProducts,inventory:pageInventory,orders:pageOrders,production:pageProduction,pos:pagePos,ecommerce:pageEcommerce,projects:pageProjects,transactions:pageTransactions,reports:pageReports,chat:pageChat,settings:pageSettings};
function pageOrders(){const list=S.orders.filter(o=>S.ordersTab==='all'?true:o.type===S.ordersTab);const seg=t=>`<button class="${S.ordersTab===t?'on':''}" data-act="otab" data-tab="${t}">${t}</button>`;return `<div class="fade" style="display:flex;flex-direction:column;gap:16px"><div class="row-between"><div class="seg">${seg('all')}${seg('sale')}${seg('purchase')}</div><button class="btn btn-pri" data-act="order-new">+ New order</button></div><div class="card"><table class="erp"><thead><tr><th class="px">Order</th><th>Partner</th><th>Date</th><th>Type</th><th>Status</th><th class="r">Total</th><th class="px"></th></tr></thead><tbody>${list.map(o=>`<tr data-flash="${o.number}"><td class="px" style="font-weight:500">${o.number}</td><td style="color:var(--mut)">${esc(o.partner)}</td><td style="color:var(--mut2)">${o.date}</td><td>${badge(o.type==='sale'?'blue':'violet',o.type)}</td><td>${badge(sTone[o.status],o.status)}</td><td class="r" style="font-weight:500">${fmt(o.total)}</td><td class="r px" style="white-space:nowrap">${S.enabled.includes('chat')?`<button class="link" data-act="goto" data-type="chat" data-key="${o.number}" title="이 건 대화 보기">💬</button> `:''}${['completed','cancelled'].includes(o.status)?'':`<button class="link" data-act="advance" data-id="${o.id}">Advance →</button>`}</td></tr>`).join('')}</tbody></table></div></div>`;}

/* =============================== modal =============================== */
function field(l,i){return `<label class="erp-lbl"><span>${l}</span>${i}</label>`;}
function openModal(title,body,onSave){$('#modal-root').innerHTML=`<div class="overlay" id="ov"><div class="modal"><div class="modal-h"><span>${title}</span><button class="x" id="mx">×</button></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn btn-ghost" id="mc">Cancel</button><button class="btn btn-pri" id="ms">Save</button></div></div></div>`;const close=()=>$('#modal-root').innerHTML='';$('#ov').onclick=e=>{if(e.target.id==='ov')close();};$('#mx').onclick=close;$('#mc').onclick=close;$('#ms').onclick=()=>onSave(close);}
const val=id=>$('#'+id).value.trim();
function modalPartner(){openModal('New partner',field('Company name','<input class="erp-fld" id="f-name">')+field('Type','<select class="erp-fld" id="f-type"><option value="customer">Customer</option><option value="supplier">Supplier</option><option value="both">Both</option></select>')+`<div class="grid" style="grid-template-columns:1fr 1fr">${field('Contact name','<input class="erp-fld" id="f-contact">')}${field('Phone','<input class="erp-fld" id="f-phone">')}</div>`+field('Email','<input class="erp-fld" id="f-email">')+field('Tax ID','<input class="erp-fld" id="f-tax">'),close=>{if(!val('f-name'))return;S.partners.push({id:uid(),name:val('f-name'),type:val('f-type'),contact:val('f-contact'),phone:val('f-phone'),email:val('f-email'),taxId:val('f-tax'),balance:0});close();renderPage();});}
function modalProduct(){const num=id=>`<input class="erp-fld" type="number" id="${id}" value="0">`;openModal('New product',`<div class="grid" style="grid-template-columns:1fr 1fr">${field('Name','<input class="erp-fld" id="f-name">')}${field('SKU','<input class="erp-fld" id="f-sku">')}${field('Category','<input class="erp-fld" id="f-cat">')}${field('Unit','<input class="erp-fld" id="f-unit" value="pcs">')}${field('Cost',num('f-cost'))}${field('Sale price',num('f-price'))}${field('Stock',num('f-stock'))}${field('Low-stock alert',num('f-alert'))}</div>`,close=>{if(!val('f-name'))return;S.products.push({id:uid(),name:val('f-name'),sku:val('f-sku'),category:val('f-cat'),unit:val('f-unit'),cost:+val('f-cost'),price:+val('f-price'),stock:+val('f-stock'),alert:+val('f-alert')});close();renderPage();});}
function modalOrder(){openModal('New order',field('Type','<select class="erp-fld" id="f-type"><option value="sale">Sales order</option><option value="purchase">Purchase order</option></select>')+field('Partner','<select class="erp-fld" id="f-partner"><option value="">Select partner…</option>'+S.partners.map(p=>`<option>${esc(p.name)}</option>`).join('')+'</select>')+`<div class="grid" style="grid-template-columns:1fr 1fr">${field('# line items','<input class="erp-fld" type="number" id="f-items" value="1">')}${field('Total amount','<input class="erp-fld" type="number" id="f-total" value="0">')}</div>`,close=>{if(!val('f-partner'))return;const pre=val('f-type')==='sale'?'SO':'PO';const number=`${pre}-${today().replace(/-/g,'')}-${String(S.orders.length+1).padStart(3,'0')}`;S.orders.push({id:uid(),number,type:val('f-type'),partner:val('f-partner'),status:'draft',date:today(),total:+val('f-total'),items:+val('f-items')});close();renderPage();});}

/* =============================== router =============================== */
function setAddr(){const host=$('#addr-host'),path=$('#addr-path');
  if(S.view==='app'){host.textContent=S.slug+'.flexible.app';path.textContent='/'+S.page;}
  else if(S.view==='onboard'){host.textContent='flexible.app';path.textContent='/setup';}
  else if(S.view==='signup'){host.textContent='flexible.app';path.textContent='/signup';}
  else if(S.view==='login'){host.textContent='flexible.app';path.textContent='/login';}
  else{host.textContent='flexible.app';path.textContent='';}}
function renderPage(){if(!PAGES[S.page])S.page='dashboard';$('#content').innerHTML=PAGES[S.page]();$('#page-title').textContent=LABEL[S.page]||'Dashboard';}
function buildErpNav(){const nav=$('#erp-nav');nav.innerHTML=enabledNav().map(n=>`<button class="nav-item ${S.page===n[0]?'active':''}" data-nav="${n[0]}"><span>${n[2]}</span>${n[1]}</button>`).join('');nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.page=b.dataset.nav;buildErpNav();renderPage();setAddr();});}
/* cross-module jump: entity tag → its record, with highlight */
function navTo(type,key){
  const map={order:'orders',partner:'partners',product:'products',lead:'leads',chat:'chat'};
  const pg=map[type]||'dashboard';
  if(pg!=='dashboard'&&!S.enabled.includes(pg))S.enabled.push(pg); // module off? snap it on
  S.page=pg;buildErpNav();renderPage();setAddr();
  const sel=(window.CSS&&CSS.escape)?CSS.escape(key):key;
  const el=document.querySelector(`[data-flash="${sel}"]`);
  if(el){el.classList.add('flash-row');el.scrollIntoView({block:'center',behavior:'smooth'});}
}
function render(){const vp=$('#viewport');
  if(S.view==='landing')vp.innerHTML=viewLanding();
  else if(S.view==='signup')vp.innerHTML=viewSignup();
  else if(S.view==='login')vp.innerHTML=viewLogin();
  else if(S.view==='onboard')vp.innerHTML=viewOnboard();
  else if(S.view==='app'){vp.innerHTML=viewApp();buildErpNav();renderPage();}
  setAddr();}

/* =============================== events =============================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='go-signup'){S.view='signup';render();}
  else if(a==='go-login'){S.view='login';render();}
  else if(a==='go-landing'){S.view='landing';render();}
  else if(a==='do-signup'){const c=$('#su-company').value.trim()||'Acme Inc.';S.company=c;S.slug=$('#su-slug').value.trim()||slugify(c);S.view='onboard';S.onboardStep=1;render();}
  else if(a==='do-login'){S.slug=$('#li-slug').value.trim()||'acme';S.company=S.slug.charAt(0).toUpperCase()+S.slug.slice(1)+' Inc.';S.enabled=['partners','leads','products','inventory','orders','transactions','reports','chat'];S.page='dashboard';S.view='app';render();}
  else if(a==='logout'){S.view='landing';render();}
  else if(a==='scrollto'){const el=$('#'+t.dataset.to);if(el)el.scrollIntoView({behavior:'smooth'});}
  // onboarding
  else if(a==='pick-ind'){S.industry=t.dataset.ind;S.enabled=[...IND[S.industry].mods];render();}
  else if(a==='toggle-mod'){const k=t.dataset.mod;
    if(S.enabled.includes(k))S.enabled=S.enabled.filter(x=>x!==k);else{S.enabled.push(k);S.pvPage=k;}
    t.classList.toggle('on');t.querySelector('.check').textContent=S.enabled.includes(k)?'✓':'';
    renderPreview(true);}
  else if(a==='pv-nav'){S.pvPage=t.dataset.pg;renderPreview(false);}
  else if(a==='ob-next'){S.onboardStep++;render();}
  else if(a==='ob-back'){S.onboardStep--;render();}
  else if(a==='ob-launch'){S.page='dashboard';S.view='app';render();}
  // ERP
  else if(a==='partner-new')modalPartner();
  else if(a==='product-new')modalProduct();
  else if(a==='order-new')modalOrder();
  else if(a==='stock'){const p=S.products.find(x=>x.id===t.dataset.id);p.stock=Math.max(0,p.stock+ +t.dataset.d);renderPage();}
  else if(a==='otab'){S.ordersTab=t.dataset.tab;renderPage();}
  else if(a==='advance'){const o=S.orders.find(x=>x.id===t.dataset.id);const fl=['draft','confirmed','shipped','completed'];const i=fl.indexOf(o.status);if(i<fl.length-1)o.status=fl[i+1];renderPage();}
  else if(a==='paid'){const tx=S.tx.find(x=>x.id===t.dataset.id);tx.status='paid';renderPage();}
  else if(a==='plan'){S.plan=t.dataset.plan;const up=$('#user-plan');if(up)up.textContent=S.plan+' plan';renderPage();}
  else if(a==='mod'){if(PLANS[S.plan].toggle){const k=t.dataset.mod;S.enabled.includes(k)?S.enabled=S.enabled.filter(x=>x!==k):S.enabled.push(k);buildErpNav();renderPage();}}
  else if(a==='goto'){navTo(t.dataset.type,t.dataset.key);}
  else if(a==='lead-adv'){const l=S.leads.find(x=>x.id===t.dataset.id);const st=['리드','상담','견적','계약'];const i=st.indexOf(l.stage);if(i<st.length-1)l.stage=st[i+1];renderPage();}
});
document.addEventListener('input',e=>{if(e.target.id==='p-search')$('#p-body').innerHTML=partnerRows(e.target.value);});

render();
</script>
</body>
</html>
